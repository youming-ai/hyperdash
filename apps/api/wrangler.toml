name = "hyperdash-api"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[placement]
mode = "smart"

[observability]
enabled = true

# Postgres via Hyperdrive (edge pooler)
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_HYPERDRIVE_ID"
localConnectionString = "postgresql://hyperdash:hyperdash_password@localhost:5432/hyperdash"

# KV for Better Auth secondary storage + rate-limit
[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_KV_ID"

[vars]
PUBLIC_ORIGIN = "http://localhost:5173"
HYPERLIQUID_API_URL = "https://api.hyperliquid.xyz/info"

# Secrets: wrangler secret put BETTER_AUTH_SECRET / RESEND_API_KEY / EMAIL_FROM
