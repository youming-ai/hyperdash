name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  # No `branches` filter here on purpose. A stacked PR targets another feature
  # branch, and requiring a `main` base meant every PR in a stack silently ran
  # no lint / test / build at all. The `push` trigger above stays scoped.
  pull_request:

env:
  GO_VERSION: '1.21'

jobs:
  # Code Quality Checks
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format check
        run: ./node_modules/.bin/biome ci .

      - name: Type checking
        run: bun run type-check

  # Tests
  test:
    continue-on-error: true
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hyperdash_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run database migrations
        continue-on-error: true
        run: bun run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hyperdash_test

      - name: Run tests
        run: bun run test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hyperdash_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          NODE_ENV: test

  # Build Applications
  build:
    name: Build Applications
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all packages and applications
        run: bun run build

      - name: Build Go copy-engine binary
        continue-on-error: true
        run: |
          mkdir -p dist
          cd apps/copy-engine
          go build -o ../../dist/copy-engine ./cmd/server
        env:
          GOOS: linux
          GOARCH: amd64

  # Security Scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    # `upload-sarif` publishes to the code-scanning API, which requires
    # `security-events: write`. Without an explicit grant the job inherited the
    # repository default (read-only) and failed at the upload step with
    # "Resource not accessible by integration" — the scan itself had succeeded.
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # Deploy web (Cloudflare Workers)
  deploy-web:
    name: Deploy Web to Cloudflare
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run database migrations
        continue-on-error: true
        run: bun run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build web
        run: bun run build --filter=web

      - name: Deploy to Cloudflare Workers
        run: bunx wrangler deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
