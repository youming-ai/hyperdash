name: Branch Protection

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-branch-protection:
    name: Check Branch Protection Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR target branch
        run: |
          TARGET_BRANCH="${{ github.base_ref }}"
          SOURCE_BRANCH="${{ github.head_ref }}"

          echo "PR from $SOURCE_BRANCH to $TARGET_BRANCH"

          # Enforce that PRs to main come from a feature branch (not main itself)
          if [[ "$TARGET_BRANCH" == "main" && "$SOURCE_BRANCH" == "main" ]]; then
            echo "❌ Cannot PR from main to main"
            exit 1
          fi

          echo "✅ Branch protection check passed"

  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ -z "$PR_BODY" || "$PR_BODY" == "" ]]; then
            echo "❌ PR must have a description"
            exit 1
          fi

          # Check for required sections in PR description
          if [[ ! "$PR_BODY" =~ "## Changes" ]]; then
            echo "❌ PR must include '## Changes' section"
            exit 1
          fi

          if [[ ! "$PR_BODY" =~ "## Testing" ]]; then
            echo "❌ PR must include '## Testing' section"
            exit 1
          fi

          echo "✅ PR description validation passed"

      - name: Check commit messages
        env:
          # The PR's own base tip. Using `origin/main` also inspected commits
          # belonging to the base branch, so a stacked PR was judged partly on
          # commits it does not contain.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Only the commits this PR actually adds.
          COMMITS=$(git log --format='%s' "${BASE_SHA}..HEAD")

          while IFS= read -r commit; do
            # Skip merge commits (GitHub auto-generates these)
            if [[ "$commit" == Merge* ]]; then
              continue
            fi
            if [[ ! "$commit" =~ ^(feat|fix|docs|style|refactor|test|chore)([(].+[)])?:\ .+ ]]; then
              echo "❌ Invalid commit message format: $commit"
              echo "Expected format: type(scope): description"
              exit 1
            fi
          done <<< "$COMMITS"

          echo "✅ Commit message validation passed"

  size-check:
    name: PR Size Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR size
        env:
          # Diff against the PR's own base. Measuring from `origin/main` counted
          # every commit below a stacked PR, so each slice was rejected for the
          # combined size of the whole stack.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Count lines changed
          LINES_CHANGED=$(git diff --stat "${BASE_SHA}..HEAD" | tail -1 | awk '{print $4}')

          # Remove + and convert to number, defaulting to 0 for an empty diff
          LINES_CHANGED=${LINES_CHANGED//[^0-9]/}
          LINES_CHANGED=${LINES_CHANGED:-0}

          echo "Lines changed: $LINES_CHANGED"

          # Warn for large PRs
          if [[ $LINES_CHANGED -gt 1000 ]]; then
            echo "⚠️ Large PR detected ($LINES_CHANGED lines). Consider breaking it into smaller PRs."
            echo "::warning::Large PR detected. Consider breaking it into smaller PRs."
          fi

          # Block very large PRs (raised to 10000 for feature migrations)
          if [[ $LINES_CHANGED -gt 10000 ]]; then
            echo "❌ Very large PR detected ($LINES_CHANGED lines). Please break it into smaller PRs."
            exit 1
          fi

          echo "✅ PR size check passed"